<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Feedly AI Overlay - Settings</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: "Segoe UI", "PingFang SC", sans-serif;
      background: linear-gradient(180deg, #f3f4f6 0%, #e5e7eb 100%);
      margin: 0;
      padding: 24px;
      min-width: 400px;
    }
    .container {
      background: #ffffff;
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
      max-width: 560px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      color: #0f172a;
    }
    .lead {
      margin: 0 0 24px;
      color: #475569;
      line-height: 1.6;
      font-size: 14px;
    }
    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      margin: 20px 0 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: #1e293b;
      font-size: 14px;
    }
    input[type="text"] {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
    }
    .hint {
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
      line-height: 1.5;
    }
    .callout {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      color: #334155;
      font-size: 13px;
      line-height: 1.6;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 11px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn:hover {
      transform: translateY(-1px);
    }
    .btn-primary {
      background: #0f766e;
      color: #ffffff;
    }
    .btn-secondary {
      background: #e2e8f0;
      color: #0f172a;
    }
    .status {
      margin-top: 16px;
      padding: 11px 12px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
    }
    .status.success {
      display: block;
      background: #ccfbf1;
      color: #115e59;
    }
    .status.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }
    code {
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Feedly AI Backend Settings</h1>
    <p class="lead">扩展现在只连接本地后端服务，不再依赖 Chrome Native Messaging 和浏览器内 API Key 配置。</p>

    <div class="section-title">Backend</div>

    <div class="form-group">
      <label for="serverBaseUrl">Server Base URL</label>
      <input type="text" id="serverBaseUrl" placeholder="http://127.0.0.1:8765">
      <div class="hint">推荐本机回环地址，例如 <code>http://127.0.0.1:8765</code>。</div>
    </div>

    <div class="callout">
      先启动项目里的本地服务，再加载扩展。
      推荐命令：<code>uv run python rss_backend_service.py --host 127.0.0.1 --port 8765</code>
    </div>

    <div class="btn-group">
      <button class="btn btn-primary" id="saveBtn">Save Settings</button>
      <button class="btn btn-secondary" id="testBtn">Test Backend</button>
      <button class="btn btn-secondary" id="resetBtn">Reset</button>
    </div>

    <div class="status" id="status"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
